name: Release

# git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        env:
          ADHOC: "1"
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Breeze-*.dmg dist/Breeze-*.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Breeze-*.dmg dist/Breeze-*.dmg.sha256 \
              --title "Breeze ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
